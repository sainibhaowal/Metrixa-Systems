<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto" style="background:#09090b; border-radius:16px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#0e131f" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="emeraldCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.8" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="1.2" fill="#334155" fill-opacity="0.5" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="80" r="140" fill="#10b981" fill-opacity="0.08" filter="url(#glow)" />
  <circle cx="1020" cy="260" r="160" fill="#0ea5e9" fill-opacity="0.08" filter="url(#glow)" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <line x1="0" y1="2" x2="1200" y2="2" stroke="url(#emeraldCyan)" stroke-width="3" />

  <!-- Hexagonal Metrixa Radar Logo -->
  <g transform="translate(85, 95)">
    <!-- Outer Hexagon Glow -->
    <polygon points="50,0 93.3,25 93.3,75 50,100 6.7,75 6.7,25" fill="#10b981" fill-opacity="0.12" stroke="url(#emeraldCyan)" stroke-width="2.5" filter="url(#glow)" />
    <!-- Inner Hexagon -->
    <polygon points="50,15 80.3,32.5 80.3,67.5 50,85 19.7,67.5 19.7,32.5" fill="#09090b" fill-opacity="0.7" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.6" />
    <!-- Radar Sweep Rings -->
    <circle cx="50" cy="50" r="22" fill="none" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.7" stroke-dasharray="3,2" />
    <circle cx="50" cy="50" r="10" fill="none" stroke="#0ea5e9" stroke-width="1.5" />
    <circle cx="50" cy="50" r="4" fill="#10b981" />
    <!-- Pulse Line -->
    <path d="M 28 50 L 42 50 L 47 40 L 53 60 L 58 50 L 72 50" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography: Product Name & Pill Badges -->
  <g transform="translate(225, 105)">
    <!-- System Pill -->
    <rect x="0" y="0" width="195" height="26" rx="13" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="12" cy="13" r="4" fill="#10b981" />
    <text x="24" y="17" fill="#34d399" font-size="11" font-weight="700" letter-spacing="1.2">ENTERPRISE LEAD INTELLIGENCE</text>

    <!-- Version Badge -->
    <rect x="205" y="0" width="130" height="26" rx="13" fill="#0ea5e9" fill-opacity="0.12" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.4" />
    <text x="217" y="17" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1">BERLIN TAM v2.4</text>

    <!-- Main Title -->
    <text x="0" y="68" fill="#f8fafc" font-size="40" font-weight="800" letter-spacing="-0.8">METRIXA ENGINE</text>
    <text x="350" y="68" fill="url(#emeraldCyan)" font-size="40" font-weight="800" letter-spacing="-0.8">COCKPIT</text>

    <!-- Subtitle -->
    <text x="0" y="98" fill="#94a3b8" font-size="15" font-weight="400" letter-spacing="0.2">
      Automated B2B Lead Discovery, Impressum Extraction, PropTech ERP Detection &amp; Qualification System
    </text>
    <text x="0" y="122" fill="#64748b" font-size="13" font-weight="400">
      Production Intelligence for Metrixa Systems GmbH | Submetering &amp; Energy Efficiency Directive (EED) Market
    </text>
  </g>

  <!-- Bottom Metric Tiles Banner -->
  <g transform="translate(80, 275)">
    <!-- Metric 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="54" rx="10" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="24" fill="#34d399" font-size="18" font-weight="800" font-family="monospace">1,200</text>
      <text x="14" y="42" fill="#64748b" font-size="10.5" font-weight="600" letter-spacing="0.4">CANONICAL LEADS</text>
    </g>

    <!-- Metric 2 -->
    <g transform="translate(195, 0)">
      <rect width="180" height="54" rx="10" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="24" fill="#38bdf8" font-size="18" font-weight="800" font-family="monospace">1,375</text>
      <text x="14" y="42" fill="#64748b" font-size="10.5" font-weight="600" letter-spacing="0.4">RAW INGESTED</text>
    </g>

    <!-- Metric 3 -->
    <g transform="translate(390, 0)">
      <rect width="180" height="54" rx="10" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="24" fill="#f59e0b" font-size="18" font-weight="800" font-family="monospace">885</text>
      <text x="14" y="42" fill="#64748b" font-size="10.5" font-weight="600" letter-spacing="0.4">PAGES CRAWLED</text>
    </g>

    <!-- Metric 4 -->
    <g transform="translate(585, 0)">
      <rect width="180" height="54" rx="10" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="24" fill="#c084fc" font-size="18" font-weight="800" font-family="monospace">41</text>
      <text x="14" y="42" fill="#64748b" font-size="10.5" font-weight="600" letter-spacing="0.4">PROPTECH ERPS</text>
    </g>

    <!-- Metric 5 -->
    <g transform="translate(780, 0)">
      <rect width="180" height="54" rx="10" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="24" fill="#10b981" font-size="18" font-weight="800" font-family="monospace">0.0%</text>
      <text x="14" y="42" fill="#64748b" font-size="10.5" font-weight="600" letter-spacing="0.4">HALLUCINATIONS</text>
    </g>

    <!-- Metric 6 -->
    <g transform="translate(975, 0)">
      <rect width="165" height="54" rx="10" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="24" fill="#38bdf8" font-size="18" font-weight="800" font-family="monospace">100%</text>
      <text x="14" y="42" fill="#64748b" font-size="10.5" font-weight="600" letter-spacing="0.4">DNS MX VERIFIED</text>
    </g>
  </g>
</svg>
